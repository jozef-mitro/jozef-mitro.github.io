<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Name Generator | RPG Tools</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/mvp.css">
    <link rel="stylesheet" href="css/theme.css">
    <script defer src="js/rpg-tools-navigation.js"></script>
    <script type="module" src="js/name-generator.js"></script>
</head>

<body>
    <header>
        <nav>
            <h1>Name Generator</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li>
                    <a href="rpg.html">RPG Tools</a>
                    <ul data-rpg-tools></ul>
                </li>
            </ul>
        </nav>
    </header>
    <hr>
    <main>
        <form id="nameGeneratorForm">
            <h2>Name Generator</h2>
            <label for="nameType">Type:</label>
            <select id="nameType">
                <option>Either</option>
                <option>Masculine</option>
                <option>Feminine</option>
            </select>
            <label for="numNames">Number:</label>
            <input type="number" id="numNames" value="10" min="1" max="20">
            <div class="button-row">
                <button type="submit">Generate Names</button>
                <button type="button" id="copyNames" disabled>Save to Clipboard</button>
            </div>
            <output id="copyNamesStatus" class="inline-status" aria-live="polite"></output>
            <div class="table-wrapper">
                <div id="names"></div>
            </div>
        </form>
    </main>
</body>

</html>
